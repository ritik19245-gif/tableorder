<script>
const SB=supabase.createClient("https://spsoahhxdllnjopqafpt.supabase.co","sb_publishable_7gV6S03eRcgHjxukEfYORw_NYS3MqDG");
const $=id=>document.getElementById(id),app=$("app"),R=n=>"₹"+Math.round(n||0),R2=n=>"₹"+(+n||0).toFixed(2);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-new Date(t))/6e4));return m<1?"just now":m+" min ago"};

const P=new URLSearchParams(location.search),parts=location.pathname.split("/").filter(Boolean);

/* ============ CUSTOMER (/r/slug?table=5) ============ */
const slug=parts[1],table=+P.get("table")||0;
let C={pay:"upi",inv:false,r:null,menu:[],cart:{},tab:"menu",cat:null,sheet:false,orders:[],ses:null,busy:false};
const TH={
 classic:{"--bg":"#f4f4f6","--card":"#fff","--tx":"#1c1c1c","--mu":"#6b6b76","--ln":"#e8e8ec","--red":"#e23744","--grn":"#1ba672","--on":"#fff","--r":"14px"},
 dark:{"--bg":"#0e0e10","--card":"#1a1a1f","--tx":"#f4f4f4","--mu":"#a0a0aa","--ln":"#2a2a31","--red":"#f5b942","--grn":"#f5b942","--on":"#111","--r":"18px"},
 royal:{"--bg":"#0b0a08","--card":"#16130e","--tx":"#f5ecd7","--mu":"#a89c80","--ln":"#3a3220","--red":"#d4af37","--grn":"#d4af37","--on":"#14110a","--r":"10px"},
 fastfood:{"--bg":"#fff3c4","--card":"#fff","--tx":"#1b1b1b","--mu":"#6a5f3a","--ln":"#ecd98f","--red":"#e8202a","--grn":"#e8202a","--on":"#fff","--r":"20px"},
 cafe:{"--bg":"#fffaf0","--card":"#fff","--tx":"#2a2a22","--mu":"#7c7c6e","--ln":"#efe8d8","--red":"#1ba672","--grn":"#1ba672","--on":"#fff","--r":"24px"}};
const GR=["#ffd9a8,#ffb170","#ffc2b8,#ff8f7a","#ffe0b0,#ffb866","#fff0b8,#ffd75e","#e8d5c4,#c9a487","#e4f7bd,#b5e86a"];
function applyTheme(r){C.th=TH[r.theme]?r.theme:"classic";const t=Object.assign({},TH[C.th]);
 const c=(r.theme_color||"").toLowerCase();
 if(/^#[0-9a-f]{6}$/.test(c)&&c!=="#e23744"){t["--red"]=t["--grn"]=c;const l=.299*parseInt(c.substr(1,2),16)+.587*parseInt(c.substr(3,2),16)+.114*parseInt(c.substr(5,2),16);t["--on"]=l>150?"#111":"#fff"}

function itemHTML(m,i){
 const q=C.cart[m.id]||0,out=!m.available,an=C.anim?" anim":"",st=`style="--i:${i};${out?"opacity:.55":""}"`;
 const so='<div style="color:var(--mu);font-size:12px;margin-top:6px">Sold out</div>';
 const b1=out?so:q?`<div class="step"><button onclick="sub('${m.id}')">−</button>${q}<button onclick="add('${m.id}')">+</button></div>`:`<button class="add" onclick="add('${m.id}')">ADD</button>`;
 const b2=out?so:q?`<div class="step" style="margin:0"><button onclick="sub('${m.id}')">−</button>${q}<button onclick="add('${m.id}')">+</button></div>`:`<button class="add" style="margin:0" onclick="add('${m.id}')">ADD</button>`;
 const dot=`<span class="dot ${m.is_veg?"":"nv"}"></span>`,g=GR[(m.name||"").length%6],pic=m.image_url?`<img src="${esc(m.image_url)}" alt="">`:"🍽️";
 if(C.th==="dark")return `<div class="card2${an}" ${st}><div class="pic2" style="background:linear-gradient(135deg,${g})">${pic}</div><div class="bd">${dot}<b>${esc(m.name)}</b><small>${esc(m.description)}</small><div class="row"><b>${R(m.price)}</b>${b2}</div></div></div>`;
 if(C.th==="royal")return `<div class="card2 lux${an}" ${st}><div class="lpic">${pic}</div><div class="lbd">${dot}<b>${esc(m.name)}</b><small>${esc(m.description)}</small><span class="lp">${R(m.price)}</span></div>${b2}</div>`;
 if(C.th==="fastfood")return `<div class="card2 ff${an}" ${st}><div class="pic2" style="background:linear-gradient(135deg,${g})">${pic}<span class="stk">${R(m.price)}</span></div><div class="bd"><b>${esc(m.name).toUpperCase()}</b>${b2}</div></div>`;
 if(C.th==="cafe")return `<div class="card2 cf2${an}" ${st}><div class="pic2" style="background:linear-gradient(135deg,${g})">${pic}</div><div class="bd"><div>${dot}<b>${esc(m.name)}</b><small>${esc(m.description)}</small><b>${R(m.price)}</b></div>${b2}</div></div>`;
 return `<div class="it${an}" ${st}><div class="t">${dot}<b>${esc(m.name)}</b><div style="margin-top:3px;font-weight:600">${R(m.price)}</div><p>${esc(m.description)}</p></div><div class="pic"><div class="e" ${m.image_url?"":`style="background:linear-gradient(135deg,${g})"`}>${pic}</div>${b1}</div></div>`}

 C.r=r;document.title=r.name;if(!r.upi_id)C.pay="counter";applyTheme(r);C.anim=true;

 C.menu=m||[];C.cat=C.menu[0]&&C.menu[0].category;

 const S2=(f,g)=>os.filter(g||(()=>true)).reduce((a,o)=>a+ +(o[f]||0),0),T=S2("total"),UP=S2("total",o=>o.payment_mode==="upi"),PD=S2("total",o=>o.payment_status==="paid");
 const im={},hr={},tb={},dy={};
 os.forEach(o=>{const d=new Date(o.created_at),k=d.toLocaleDateString("en-CA"),hh=d.getHours();hr[hh]=(hr[hh]||0)+1;tb[o.table_no]=(tb[o.table_no]||0)+ +o.total;dy[k]=(dy[k]||0)+ +o.total;(o.order_items||[]).forEach(x=>{const e=im[x.name]=im[x.name]||{q:0,r:0};e.q+=x.qty;e.r+=x.price*x.qty})});
 const items=Object.entries(im).sort((a,b)=>b[1].q-a[1].q),mx=items.length?items[0][1].q:1;
 const card=(l,v,s)=>`<div class="sc"><small>${l}</small><b>${v}</b>${s?`<small>${s}</small>`:""}</div>`;
 const bar=(l,v,m,t)=>`<div class="rb"><span class="rl">${l}</span><div class="rt"><i style="width:${Math.max(3,v/m*100)}%"></i></div><span class="rv">${t}</span></div>`;
 h+=`<div class="sg">${card("Total sales",R2(T))}${card("Orders",n)}${card("Average bill",R2(T/n))}${card("Online (UPI)",R2(UP),Math.round(UP/T*100)+"% of sales")}${card("Paid",R2(PD),R2(T-PD)+" pending")}${card("Discount given",R2(S2("discount")),"GST "+R2(S2("gst")))}</div>`;
 h+=`<div class="row" style="gap:8px"><button class="go" onclick="dl('orders')">⬇ Orders CSV</button><button class="go" onclick="dl('items')">⬇ Items CSV</button></div><p style="color:var(--mu);font-size:12px;margin:6px 0 0">CSV files open directly in Google Sheets and Excel.</p>`;
 h+=`<h3 class="rh">🏆 Top selling items</h3><div class="box">${items.slice(0,8).map(x=>bar(esc(x[0]),x[1].q,mx,x[1].q+" · "+R(x[1].r))).join("")}</div>`;
 if(items.length>3)h+=`<h3 class="rh">🐌 Least selling</h3><div class="box">${items.slice(-3).reverse().map(x=>bar(esc(x[0]),x[1].q,mx,x[1].q+" · "+R(x[1].r))).join("")}</div>`;
 const hrs=Object.keys(hr).map(Number).sort((a,b)=>a-b),hm=Math.max.apply(null,hrs.map(k=>hr[k]));
 h+=`<h3 class="rh">⏰ Peak hours</h3><div class="box">${hrs.map(k=>bar((k%12||12)+(k<12?" AM":" PM"),hr[k],hm,hr[k]+" orders")).join("")}</div>`;
 const tbs=Object.entries(tb).sort((a,b)=>b[1]-a[1]);
 h+=`<h3 class="rh">🪑 Table-wise sales</h3><div class="box">${tbs.map(x=>bar("Table "+x[0],x[1],tbs[0][1],R(x[1]))).join("")}</div>`;
 const dys=Object.keys(dy).sort();if(dys.length>1){const dm=Math.max.apply(null,dys.map(k=>dy[k]));h+=`<h3 class="rh">📈 Daily sales</h3><div class="box">${dys.map(k=>bar(k.slice(5),dy[k],dm,R(dy[k]))).join("")}</div>`}
 return h}
async function adv(id,st){await SB.from("orders").update({status:st}).eq("id",id);refresh()}
async function confirmUpi(t){await SB.from("orders").update({payment_status:"paid"}).eq("restaurant_id",A.r.id).eq("table_no",t).eq("payment_status","claimed").eq("closed",false);refresh()}
async function closeT(t){await SB.from("orders").update({payment_status:"paid",closed:true}).eq("restaurant_id",A.r.id).eq("table_no",t).eq("closed",false);await SB.from("table_sessions").update({status:"closed"}).eq("restaurant_id",A.r.id).eq("table_no",t).eq("status","open");refresh()}
async function addItem(){const n=$("an").value.trim(),p=+$("ap").value,c=$("ac").value.trim();if(!n||!p||!c)return alert("Name, price and category are required");
 let img=null;const f=$("af").files[0];if(f){toast("Uploading photo…");try{img=await uploadImg(f)}catch(e){return alert("Photo upload failed: "+(e.message||e))}}
 const {error}=await SB.from("menu_items").insert({restaurant_id:A.r.id,name:n,price:p,category:c,description:$("ad").value.trim(),is_veg:$("av").value==="1",image_url:img});
 if(error)return alert(error.message);toast("Item added");$("af").value="";A.tab="menu";refresh()}
async function setPrice(id,v){if(!(+v>0))return;const {error}=await SB.from("menu_items").update({price:+v}).eq("id",id);toast(error?error.message:"Price updated")}
async function toggle(id,a){await SB.from("menu_items").update({available:a}).eq("id",id);refresh()}
async function rem(id){if(!confirm("Remove this item from the menu?"))return;await SB.from("menu_items").update({hidden:true}).eq("id",id);refresh()}

else app.innerHTML='<div class="empty"><h2>TableOrder</h2>Scan the QR code on your table to order.<br><br><a href="/staff" style="color:var(--red)">Restaurant login</a></div>';
