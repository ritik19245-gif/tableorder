<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TableOrder</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#1c1c1c;--mu:#6b6b76;--ln:#e8e8ec;--red:#e23744;--grn:#1ba672;--amb:#f5a623}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1d1d21;--tx:#f2f2f4;--mu:#9a9aa6;--ln:#2c2c32;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
button{font:inherit;cursor:pointer;border:0}input,select,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);width:100%}
.wrap{max-width:480px;margin:0 auto;padding-bottom:110px}.wide{max-width:1000px;margin:0 auto;padding:16px}
.hd{background:var(--card);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.hd b{font-size:19px}.hd small{color:var(--mu);display:block}
.chip{background:var(--red);color:#fff;padding:6px 12px;border-radius:16px;font-weight:700;font-size:13px}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--ln)}.tabs button{flex:1;padding:12px;background:none;color:var(--mu);font-weight:700;border-bottom:3px solid transparent}.tabs button.on{color:var(--red);border-color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}.chips button{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--ln);color:var(--tx);font-weight:600;font-size:13px}.chips button.on{background:var(--tx);color:var(--bg)}
.it{display:flex;gap:12px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--ln)}.it .t{flex:1}.it p{margin:4px 0 0;color:var(--mu);font-size:13px}
.dot{display:inline-block;width:14px;height:14px;border:2px solid var(--grn);border-radius:3px;position:relative;vertical-align:-2px;margin-right:6px}.dot:after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--grn)}.dot.nv{border-color:#b3261e}.dot.nv:after{background:#b3261e}
.pic{width:112px;text-align:center;flex-shrink:0}.pic .e{height:100px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:40px;background:#ffe9d6;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}
.add{margin-top:-14px;position:relative;background:var(--card);color:var(--grn);border:1px solid var(--ln);border-radius:9px;padding:7px 0;width:80px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.step{margin:-14px auto 0;position:relative;display:flex;width:80px;justify-content:space-between;align-items:center;background:var(--grn);color:#fff;border-radius:9px;font-weight:800}.step button{background:none;color:#fff;padding:7px 10px;font-size:16px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:calc(100% - 24px);max-width:456px;background:var(--grn);color:#fff;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;font-weight:700;z-index:6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.box{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:8px}.row.s{color:var(--mu);font-size:14px}.row.tot{font-weight:800;font-size:17px;border-top:1px dashed var(--ln);padding-top:10px;margin-top:10px}
.cta{width:100%;background:var(--red);color:#fff;padding:15px;border-radius:12px;font-weight:800;font-size:16px}.cta:disabled{opacity:.6}
.st{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700}.s-new{background:#fde8ea;color:#c0242f}.s-preparing{background:#fff3da;color:#a86a00}.s-ready{background:#dcf5ea;color:#0f7a52}.s-served,.s-cancelled{background:var(--bg);color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.kc{background:var(--card);border-radius:14px;padding:14px;border-top:5px solid var(--red)}.kc.preparing{border-color:var(--amb)}.kc.ready{border-color:var(--grn)}
.kc h4{margin:0 0 6px;font-size:18px;display:flex;justify-content:space-between}.kc ul{margin:8px 0;padding-left:18px}.note{background:#fff3da;color:#7a5200;padding:6px 8px;border-radius:8px;font-size:13px;margin:6px 0}
.go{width:100%;padding:11px;border-radius:10px;background:var(--tx);color:var(--bg);font-weight:700;margin-top:6px}.go.g{background:var(--grn);color:#fff}.go.x{background:#fde8ea;color:#c0242f}
.empty{text-align:center;color:var(--mu);padding:50px 16px}.top{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:12px 16px}.top button{background:var(--bg);color:var(--tx);padding:8px 12px;border-radius:10px}
.mr{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);padding:8px 12px;border-radius:10px;margin-bottom:6px}.mr input[type=number]{width:80px}.mr button{padding:8px 10px;border-radius:8px;background:var(--bg);color:var(--tx)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:20;font-weight:600}
.pay{display:flex;gap:10px;align-items:center;padding:12px;border:2px solid var(--ln);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--card)}.pay.on{border-color:var(--red)}.pay small{color:var(--mu);display:block}
.save{background:var(--grn);color:#fff;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;margin-left:auto;white-space:nowrap}
.offer{margin:12px 16px 0;padding:12px;border-radius:12px;background:linear-gradient(120deg,#e23744,#ff7a45);color:#fff;font-weight:600}.offer small{display:block;font-weight:400;opacity:.9}
@media print{.wrap,.bar,.noprint,.toast{display:none!important}.ov{position:static!important;background:none!important;display:block!important}.sheet{max-height:none!important;overflow:visible!important;background:#fff!important;color:#000!important;padding:0!important;max-width:none!important}body{background:#fff!important}.box{border:1px solid #ddd;background:#fff!important}.row,.row.s{color:#000!important}}
</style></head><body><div id="app"><div class="empty">Loading…</div></div>
<input id="pf" type="file" accept="image/*" style="display:none" onchange="setPhoto()">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.js"></script>
<script>
const SB=supabase.createClient("https://spsoahhxdllnjopqafpt.supabase.co","sb_publishable_7gV6S03eRcgHjxukEfYORw_NYS3MqDG");
const $=id=>document.getElementById(id),app=$("app"),R=n=>"₹"+Math.round(n||0),R2=n=>"₹"+(+n||0).toFixed(2);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-new Date(t))/6e4));return m<1?"just now":m+" min ago"};
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const P=new URLSearchParams(location.search),parts=location.pathname.split("/").filter(Boolean);
const LAB={new:"Order received",preparing:"Being prepared",ready:"Ready, coming to your table",served:"Served",cancelled:"Cancelled"};

/* ============ CUSTOMER (/r/slug?table=5) ============ */
const slug=parts[1],table=+P.get("table")||0;
let C={pay:"upi",inv:false,r:null,menu:[],cart:{},tab:"menu",cat:null,sheet:false,orders:[],ses:null,busy:false};
async function custInit(){
 const {data:r}=await SB.from("restaurants").select("*").eq("slug",slug).maybeSingle();
 if(!r){app.innerHTML='<div class="empty">Restaurant not found. Please scan the QR code again.</div>';return}
 if(!table||table>r.table_count){app.innerHTML='<div class="empty">Invalid table. Please scan the QR code on your table.</div>';return}
 C.r=r;document.title=r.name;if(!r.upi_id)C.pay="counter";
 const {data:m}=await SB.from("menu_items").select("*").eq("restaurant_id",r.id).eq("hidden",false).order("sort").order("name");
 C.menu=m||[];C.cat=C.menu[0]&&C.menu[0].category;
 try{const s=JSON.parse(localStorage.getItem("ses_"+slug+"_"+table)||"null");if(s&&s.exp>Date.now())C.ses=s.id}catch(e){}
 await pollOrders();custRender();setInterval(pollOrders,5000)}
async function pollOrders(){if(!C.ses)return;const {data}=await SB.rpc("session_orders",{p_session:C.ses});if(data){C.orders=data;if(C.tab==="orders"&&!C.sheet)custRender()}}
const cartItems=()=>C.menu.filter(m=>C.cart[m.id]).map(m=>({...m,q:C.cart[m.id]}));
const calc=(it,upi)=>{const s=it.reduce((a,i)=>a+i.price*i.q,0),d=upi?Math.min(Math.round(s*(+C.r.online_discount_pct||0))/100,+C.r.online_discount_max||0):0,t=s-d,g=t*.05;return{sub:s,disc:d,gst:g,total:t+g}};
const add=id=>{C.cart[id]=(C.cart[id]||0)+1;custRender()},sub=id=>{C.cart[id]--;if(!C.cart[id])delete C.cart[id];if(!Object.keys(C.cart).length)C.sheet=false;custRender()};
function custRender(){
 const cats=[...new Set(C.menu.map(m=>m.category))];
 let h=`<div class="wrap"><div class="hd"><div><b>${esc(C.r.name)}</b><small>Scan, order, enjoy</small></div><span class="chip">Table ${table}</span></div>
 <div class="tabs"><button class="${C.tab==="menu"?"on":""}" onclick="C.tab='menu';custRender()">Menu</button><button class="${C.tab==="orders"?"on":""}" onclick="C.tab='orders';custRender()">My Orders</button></div>`;
 if(C.tab==="menu"){
  h+=(+C.r.online_discount_pct>0&&C.r.upi_id?`<div class="offer">💸 Pay online via UPI and get ${C.r.online_discount_pct}% OFF<small>Up to ${R(C.r.online_discount_max)} off · Instant digital invoice</small></div>`:"");
  h+=`<div class="chips">${cats.map(c=>`<button class="${c===C.cat?"on":""}" onclick="C.cat=this.textContent;custRender()">${esc(c)}</button>`).join("")}</div>`;
  h+=C.menu.filter(m=>m.category===C.cat).map(m=>{const q=C.cart[m.id]||0;
   const btn=!m.available?'<div style="color:var(--mu);font-size:12px;margin-top:6px">Sold out</div>':q?`<div class="step"><button onclick="sub('${m.id}')">−</button>${q}<button onclick="add('${m.id}')">+</button></div>`:`<button class="add" onclick="add('${m.id}')">ADD</button>`;
   return `<div class="it" style="${m.available?"":"opacity:.55"}"><div class="t"><span class="dot ${m.is_veg?"":"nv"}"></span><b>${esc(m.name)}</b><div style="margin-top:3px;font-weight:600">${R(m.price)}</div><p>${esc(m.description)}</p></div><div class="pic"><div class="e">${m.image_url?`<img src="${esc(m.image_url)}" alt="">`:"🍽️"}</div>${btn}</div></div>`}).join("");
  if(!C.menu.length)h+='<div class="empty">Menu is empty.</div>';
 }else{
  if(!C.orders.length)h+=`<div class="empty">🍽️<br><br>No orders yet for Table ${table}.<br><br><button class="cta" onclick="C.tab='menu';custRender()">Browse menu</button></div>`;
  else{let T=0,paid=0,upiDue=0,clm=0;h+='<div style="padding:12px 16px">';
   C.orders.forEach(o=>{if(o.status!=="cancelled"){T+=+o.total;if(o.paid)paid+=+o.total;else if(o.mode==="upi"&&o.pay==="pending")upiDue+=+o.total;else if(o.pay==="claimed")clm+=+o.total}
    h+=`<div class="box"><div class="row"><b>Order #${o.id}</b><span class="st s-${o.status}">${LAB[o.status]||o.status}</span></div>${(o.items||[]).map(x=>`<div class="row s"><span>${x.qty} × ${esc(x.name)}</span><span>${R(x.price*x.qty)}</span></div>`).join("")}${o.note?`<div class="note">📝 ${esc(o.note)}</div>`:""}<div class="row s"><span>${ago(o.created_at)}</span><b style="color:var(--tx)">${R2(o.total)}${o.paid?" ✓ Paid":o.pay==="claimed"?" · verifying":""}</b></div></div>`});
   h+=`<div class="box"><div class="row tot" style="border:0;margin:0;padding:0"><span>Table bill</span><span>${R2(T)}</span></div>${T-paid-upiDue-clm>0.5?`<div class="row s"><span>To pay at counter</span><span>${R2(T-paid-upiDue-clm)}</span></div>`:""}${clm>0?`<div class="row s"><span>UPI payment being verified</span><span>${R2(clm)}</span></div>`:""}<div class="row s"><span>Paid</span><span>${R2(paid)}</span></div></div>${upiDue>0?`<a class="cta" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px" href="${esc(upiLink(upiDue))}">📲 Pay ${R2(upiDue)} via UPI</a><div class="row" style="gap:8px"><button class="cta" style="background:var(--card);color:var(--tx);border:1px solid var(--ln);padding:11px" onclick="copyUpi()">Copy UPI ID</button><button class="cta" style="background:var(--grn);padding:11px" onclick="claim()">✅ I have paid</button></div><p style="color:var(--mu);font-size:12px;text-align:center">If your UPI app does not open, copy the UPI ID and pay manually.</p>`:""}<button class="cta" style="background:var(--card);color:var(--tx);border:1px solid var(--ln);margin-bottom:8px" onclick="C.inv=true;custRender()">🧾 View invoice</button><button class="cta" onclick="C.tab='menu';custRender()">+ Add more items</button></div>`}
 }
 h+="</div>";
 const n=Object.values(C.cart).reduce((a,b)=>a+b,0);
 if(n&&C.tab==="menu")h+=`<div class="bar" onclick="C.sheet=true;custRender()"><span>${n} item${n>1?"s":""} added</span><span>View cart · ${R2(calc(cartItems(),C.pay==="upi").total)} ›</span></div>`;
 if(C.sheet){const it=cartItems(),c=calc(it,C.pay==="upi"),cu=calc(it,true);
  h+=`<div class="ov" onclick="if(event.target===this){C.sheet=false;custRender()}"><div class="sheet"><h2 style="margin:0 0 12px">Your cart · Table ${table}</h2><div class="box">${it.map(x=>`<div class="row"><span><span class="dot ${x.is_veg?"":"nv"}"></span>${esc(x.name)}</span><span class="step" style="margin:0;width:78px"><button onclick="sub('${x.id}')">−</button>${x.q}<button onclick="add('${x.id}')">+</button></span><b>${R(x.price*x.q)}</b></div>`).join("")}</div>
  <div class="box"><textarea id="note" rows="2" maxlength="200" placeholder="Cooking instructions? (e.g. less spicy, no onion)"></textarea></div>
  ${C.r.upi_id?`<div class="pay ${C.pay==="upi"?"on":""}" onclick="C.pay='upi';custRender()"><span style="font-size:24px">📲</span><div><b>Pay online (UPI)</b><small>Instant digital invoice</small></div>${cu.disc>0?`<span class="save">Save ${R2(cu.disc)}</span>`:""}</div>`:""}<div class="pay ${C.pay==="counter"?"on":""}" onclick="C.pay='counter';custRender()"><span style="font-size:24px">🧾</span><div><b>Pay at counter</b><small>Pay after your meal</small></div></div>
  <div class="box"><div class="row s"><span>Item total</span><span>${R2(c.sub)}</span></div>${c.disc>0?`<div class="row s" style="color:var(--grn)"><span>Online payment discount</span><span>−${R2(c.disc)}</span></div>`:""}<div class="row s"><span>GST (5%)</span><span>${R2(c.gst)}</span></div><div class="row tot"><span>${C.pay==="upi"?"To pay now":"To pay at counter"}</span><span>${R2(c.total)}</span></div></div>
  <button class="cta" id="pl" onclick="place()">${C.pay==="upi"?"Place order & pay "+R2(c.total):"Place order"}</button></div></div>`}
 if(C.inv)h+=invoiceHTML();const keep=$("note")?$("note").value:"";app.innerHTML=h;if(keep&&$("note"))$("note").value=keep}
function upiLink(a){return "upi://pay?pa="+C.r.upi_id+"&pn="+encodeURIComponent(C.r.name)+"&am="+(+a).toFixed(2)+"&cu=INR&tn="+encodeURIComponent("Table "+table+" order")}
function copyUpi(){try{navigator.clipboard.writeText(C.r.upi_id);toast("UPI ID copied")}catch(e){alert(C.r.upi_id)}}
async function claim(){await SB.rpc("claim_payment",{p_session:C.ses});await pollOrders();custRender();toast("Thanks! The restaurant will confirm your payment.")}
function invoiceHTML(){
 const os=C.orders.filter(o=>o.status!=="cancelled"),m={};
 os.forEach(o=>(o.items||[]).forEach(x=>{const k=x.name+"|"+x.price;m[k]=m[k]||{n:x.name,p:+x.price,q:0};m[k].q+=x.qty}));
 const sm=f=>os.reduce((a,o)=>a+ +(o[f]||0),0),paid=os.length>0&&os.every(o=>o.paid),d=new Date(os[0]?os[0].created_at:Date.now());
 return `<div class="ov" onclick="if(event.target===this){C.inv=false;custRender()}"><div class="sheet"><div style="text-align:center"><h2 style="margin:0">${esc(C.r.name)}</h2>${C.r.gstin?`<small>GSTIN: ${esc(C.r.gstin)}</small>`:""}<div style="margin:6px 0;font-weight:700">BILL / INVOICE</div></div>
 <div class="row s"><span>Invoice no.</span><span>INV-${os[0]?os[0].id:""}</span></div><div class="row s"><span>Date</span><span>${d.toLocaleString("en-IN")}</span></div><div class="row s"><span>Table</span><span>${table}</span></div>
 <div class="box" style="margin-top:10px">${Object.values(m).map(x=>`<div class="row"><span>${x.q} × ${esc(x.n)}</span><span>${R2(x.p*x.q)}</span></div>`).join("")}</div>
 <div class="box"><div class="row s"><span>Subtotal</span><span>${R2(sm("subtotal"))}</span></div>${sm("discount")>0?`<div class="row s" style="color:var(--grn)"><span>Online payment discount</span><span>−${R2(sm("discount"))}</span></div>`:""}<div class="row s"><span>GST (5%)</span><span>${R2(sm("gst"))}</span></div><div class="row tot"><span>Total</span><span>${R2(sm("total"))}</span></div><div class="row s"><span>Payment</span><b style="color:${paid?"var(--grn)":"var(--red)"}">${paid?"PAID":"PENDING"}</b></div></div>
 <p style="text-align:center;color:var(--mu);font-size:13px">Thank you for dining with us!</p>
 <button class="cta noprint" onclick="window.print()">⬇ Download / Print invoice</button><button class="cta noprint" style="margin-top:8px;background:var(--card);color:var(--tx);border:1px solid var(--ln)" onclick="C.inv=false;custRender()">Close</button></div></div>`}
async function place(){
 if(C.busy)return;C.busy=true;$("pl").disabled=true;
 const items=Object.entries(C.cart).map(([id,qty])=>({id,qty})),note=$("note").value;
 const {data,error}=await SB.rpc("place_order",{p_slug:slug,p_table:table,p_session:C.ses,p_note:note,p_items:items,p_pay:C.pay});
 C.busy=false;if(error){alert("Order failed: "+error.message);custRender();return}
 C.ses=data.session_id;try{localStorage.setItem("ses_"+slug+"_"+table,JSON.stringify({id:C.ses,exp:Date.now()+4*36e5}))}catch(e){}
 C.cart={};C.sheet=false;C.tab="orders";await pollOrders();custRender();toast("Order placed! Kitchen has been notified.")}

/* ============ STAFF (/staff) ============ */
let A={r:null,tab:"orders",orders:[],menu:[]};
async function staffInit(){const {data:{session}}=await SB.auth.getSession();session?loadStaff():login()}
function login(){app.innerHTML=`<div class="wrap" style="padding:24px 16px"><h2>Restaurant login</h2><div class="box" style="display:grid;gap:10px"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="cta" onclick="doLogin()">Login</button></div></div>`}
async function doLogin(){const {error}=await SB.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)return alert(error.message);loadStaff()}
async function logout(){await SB.auth.signOut();location.reload()}
async function loadStaff(){
 const {data:{user}}=await SB.auth.getUser();
 const {data:r}=await SB.from("restaurants").select("*").eq("owner_id",user.id).maybeSingle();
 if(!r){app.innerHTML='<div class="empty">No restaurant is linked to this account.<br><br><button class="cta" onclick="logout()">Logout</button></div>';return}
 A.r=r;await refresh();SB.channel("rt").on("postgres_changes",{event:"*",schema:"public",table:"orders"},refresh).subscribe();setInterval(refresh,10000)}
async function refresh(){
 const since=new Date(Date.now()-864e5).toISOString();
 const [o,m]=await Promise.all([SB.from("orders").select("*,order_items(*)").eq("restaurant_id",A.r.id).gte("created_at",since).order("id"),SB.from("menu_items").select("*").eq("restaurant_id",A.r.id).eq("hidden",false).order("category").order("name")]);
 A.orders=o.data||[];A.menu=m.data||[];
 if(A.tab==="menu"&&(($("af")&&$("af").files.length)||(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName))))return;staffRender()}
function staffRender(){
 let h=`<div class="top"><b>${esc(A.r.name)}</b><button onclick="logout()">Logout</button></div><div class="tabs">${[["orders","👨‍🍳 Kitchen"],["bills","🧾 Bills"],["menu","🍴 Menu"]].map(t=>`<button class="${A.tab===t[0]?"on":""}" onclick="A.tab='${t[0]}';staffRender()">${t[1]}</button>`).join("")}</div><div class="wide">`;
 if(A.tab==="orders"){const act=A.orders.filter(o=>["new","preparing","ready"].includes(o.status));
  h+=act.length?`<div class="grid">${act.map(o=>`<div class="kc ${o.status}"><h4><span>Table ${o.table_no}</span><span style="font-size:13px;color:var(--mu)">#${o.id} · ${ago(o.created_at)}</span></h4><span class="st s-${o.status}">${o.status.toUpperCase()}</span><span class="st" style="margin-left:6px;background:var(--bg);color:var(--mu)">${o.payment_mode==="upi"?(o.payment_status==="paid"?"UPI paid":o.payment_status==="claimed"?"UPI claimed":"UPI pending"):"Pay at counter"}</span><ul>${(o.order_items||[]).map(x=>`<li><b>${x.qty} ×</b> ${esc(x.name)}</li>`).join("")}</ul>${o.note?`<div class="note">📝 ${esc(o.note)}</div>`:""}<button class="go" onclick="adv(${o.id},'${{new:"preparing",preparing:"ready",ready:"served"}[o.status]}')">${{new:"Start preparing",preparing:"Mark ready",ready:"Mark served"}[o.status]}</button>${o.status==="new"?`<button class="go x" onclick="if(confirm('Cancel this order?'))adv(${o.id},'cancelled')">Cancel order</button>`:""}</div>`).join("")}</div>`:'<div class="empty">No active orders. New orders appear here live.</div>'}
 if(A.tab==="bills"){const tb={};A.orders.filter(o=>!o.closed&&o.status!=="cancelled").forEach(o=>(tb[o.table_no]=tb[o.table_no]||[]).push(o));const ks=Object.keys(tb);
  h+=ks.length?`<div class="grid">${ks.map(t=>{const os=tb[t],sm=f=>os.filter(f).reduce((a,o)=>a+ +o.total,0),T=sm(o=>1),P=sm(o=>o.payment_status==="paid"),CL=sm(o=>o.payment_status==="claimed"),B=T-P-CL,dsc=os.reduce((a,o)=>a+ +(o.discount||0),0),it={};os.forEach(o=>(o.order_items||[]).forEach(x=>it[x.name]=(it[x.name]||0)+x.qty));
   return `<div class="kc" style="border-color:var(--red)"><h4><span>Table ${t}</span><span style="font-size:13px;color:var(--mu)">${os.length} order${os.length>1?"s":""}</span></h4>${Object.keys(it).map(n=>`<div class="row s"><span>${it[n]} × ${esc(n)}</span></div>`).join("")}${dsc>0?`<div class="row s"><span>Online discount given</span><span>−${R(dsc)}</span></div>`:""}<div class="row tot"><span>Total (incl. GST)</span><span>${R2(T)}</span></div><div class="row s"><span>Paid (confirmed)</span><span>${R2(P)}</span></div>${CL>0?`<div class="note">📲 Customer says UPI paid ${R2(CL)}. Check your bank or UPI app, then confirm.</div><button class="go" onclick="confirmUpi(${t})">✓ Confirm UPI received ${R2(CL)}</button>`:""}<div class="row"><b>Balance</b><b style="color:${B>0.5?"var(--red)":"var(--grn)"}">${R2(B)}</b></div><button class="go g" onclick="closeT(${t})">${B>0.5?"Collect "+R2(B)+" & close table":"Close table"}</button></div>`}).join("")}</div>`:'<div class="empty">No open tables.</div>'}
 if(A.tab==="menu"){
  h+=`<div class="kc" style="border-color:var(--grn);margin-bottom:14px"><b>Add new item</b><div style="display:grid;gap:8px;margin-top:8px"><input id="an" placeholder="Item name"><input id="ap" type="number" placeholder="Price ₹"><input id="ad" placeholder="Short description"><input id="ac" placeholder="Category (e.g. Starters)" list="cl"><datalist id="cl">${[...new Set(A.menu.map(m=>m.category))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist><select id="av"><option value="1">Veg</option><option value="0">Non-veg</option></select><label style="font-size:13px;color:var(--mu)">📷 Food photo (optional)</label><input id="af" type="file" accept="image/*"><button class="go g" onclick="addItem()">+ Add item</button></div></div>`;
  h+=A.menu.map(m=>`<div class="mr">${m.image_url?`<img src="${esc(m.image_url)}" style="width:44px;height:44px;border-radius:8px;object-fit:cover" alt="">`:""}<span style="flex:1;${m.available?"":"text-decoration:line-through;opacity:.6"}">${esc(m.name)}<br><small style="color:var(--mu)">${esc(m.category)}</small></span>₹<input type="number" value="${m.price}" onchange="setPrice('${m.id}',this.value)"><button onclick="pickPhoto('${m.id}')">📷</button><button onclick="toggle('${m.id}',${!m.available})">${m.available?"Sold out":"Available"}</button><button onclick="rem('${m.id}')">🗑</button></div>`).join("")}
 h+="</div>";app.innerHTML=h}
async function uploadImg(file){
 const bmp=await createImageBitmap(file),sc=Math.min(1,900/Math.max(bmp.width,bmp.height));
 const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
 cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
 const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.82));
 const path=A.r.id+"/"+Date.now()+".jpg";
 const {error}=await SB.storage.from("menu-images").upload(path,blob,{contentType:"image/jpeg"});
 if(error)throw error;return SB.storage.from("menu-images").getPublicUrl(path).data.publicUrl}
let PH=null;function pickPhoto(id){PH=id;$("pf").value="";$("pf").click()}
async function setPhoto(){const f=$("pf").files[0];if(!f||!PH)return;toast("Uploading photo…");
 try{const u=await uploadImg(f);const {error}=await SB.from("menu_items").update({image_url:u}).eq("id",PH);if(error)throw error;toast("Photo updated");refresh()}
 catch(e){alert("Photo upload failed: "+(e.message||e))}}
async function adv(id,st){await SB.from("orders").update({status:st}).eq("id",id);refresh()}
async function confirmUpi(t){await SB.from("orders").update({payment_status:"paid"}).eq("restaurant_id",A.r.id).eq("table_no",t).eq("payment_status","claimed").eq("closed",false);refresh()}
async function closeT(t){await SB.from("orders").update({payment_status:"paid",closed:true}).eq("restaurant_id",A.r.id).eq("table_no",t).eq("closed",false);await SB.from("table_sessions").update({status:"closed"}).eq("restaurant_id",A.r.id).eq("table_no",t).eq("status","open");refresh()}
async function addItem(){const n=$("an").value.trim(),p=+$("ap").value,c=$("ac").value.trim();if(!n||!p||!c)return alert("Name, price and category are required");
 let img=null;const f=$("af").files[0];if(f){toast("Uploading photo…");try{img=await uploadImg(f)}catch(e){return alert("Photo upload failed: "+(e.message||e))}}
 const {error}=await SB.from("menu_items").insert({restaurant_id:A.r.id,name:n,price:p,category:c,description:$("ad").value.trim(),is_veg:$("av").value==="1",image_url:img});
 if(error)return alert(error.message);toast("Item added");$("af").value="";A.tab="menu";refresh()}
async function setPrice(id,v){if(!(+v>0))return;const {error}=await SB.from("menu_items").update({price:+v}).eq("id",id);toast(error?error.message:"Price updated")}
async function toggle(id,a){await SB.from("menu_items").update({available:a}).eq("id",id);refresh()}
async function rem(id){if(!confirm("Remove this item from the menu?"))return;await SB.from("menu_items").update({hidden:true}).eq("id",id);refresh()}

if(parts[0]==="r")custInit();else if(parts[0]==="staff")staffInit();
else app.innerHTML='<div class="empty"><h2>TableOrder</h2>Scan the QR code on your table to order.<br><br><a href="/staff" style="color:var(--red)">Restaurant login</a></div>';
</script></body></html>
